name: productshowcase

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: $"{MYSQL_ROOT_PASSWORD:-Root_SecPass_2026!#}
      MYSQL_DATABASE: $"{MYSQL_DATABASE:-wordpress}
      MYSQL_USER: $"{MYSQL_USER:-wpapp}
      MYSQL_PASSWORD: $"{MYSQL_PASSWORD:-Wp_App_StrongPass2026!#}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: $"{MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: $"{MYSQL_USER:-wpapp}
      WORDPRESS_DB_PASSWORD: $"{MYSQL_PASSWORD:-Wp_App_StrongPass2026!#}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress_data:/var/www/html
      - ./theme/techshow:/var/www/html/wp-content/themes/techshow:ro
    networks:
      - application
      - database
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    user: 101:101
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    ports:
      - "$"{WEB_PORT:-8080}:8080"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_data:/var/www/html:ro
      - ./theme/techshow:/var/www/html/wp-content/themes/techshow:ro
      - nginx_logs:/var/log/project
    networks:
      - application
      - monitoring
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PMA_HOST: mysql
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:18081:80"
    networks:
      - database
      - management
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    user: 65534:65534
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    depends_on:
      - nginx

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "$"{MYSQL_USER:-wpapp}:$"{MYSQL_PASSWORD:-Wp_App_StrongPass2026!#}@(mysql:3306)/$"{MYSQL_DATABASE:-wordpress}"
    user: 65534:65534
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - monitoring
    depends_on:
      mysql:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    user: 65534:65534
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    user: 472:472
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: $"{GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: $"{GRAFANA_ADMIN_PASSWORD:-Grafana_Admin_Sec2026!#}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - management
    depends_on:
      - prometheus

networks:
  application: {}
  database:
    internal: true
  monitoring: {}
  management: {}

volumes:
  mysql_data: {}
  wordpress_data: {}
  prometheus_data: {}
  grafana_data: {}
  nginx_logs: {}