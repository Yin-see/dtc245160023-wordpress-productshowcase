server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
  - job_name: nginx_access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: website
          __path__: /var/log/project/access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            method: method
      - labels:
          status:
          method:
  - job_name: nginx_error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_error
          __path__: /var/log/project/error.log
