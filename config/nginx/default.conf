log_format project escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"bytes":$body_bytes_sent}';
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    client_max_body_size 32m;
    access_log /var/log/project/access.log project;
    error_log /var/log/project/error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / { try_files $uri $uri/ /index.php?$args; }
    location = /xmlrpc.php { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
    location ~ /\. { deny all; }
    location ~* ^/(wp-config\.php|readme\.html|license\.txt)$ { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass wordpress:9000;
    }
}
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
